; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
extra_scripts = pre:webconverter.py
lib_deps = 
	spacehuhn/SimpleCLI@^1.1.4
	me-no-dev/AsyncTCP@^1.1.1
	https://github.com/me-no-dev/ESPAsyncWebServer.git
	adafruit/Adafruit NeoPixel@^1.15.5
build_flags = 
	-D USB_CUSTOM_DESCRIPTORS
	-I custom_usb_descriptors
	-D USB_VID=0x303a
	-D USB_MANUFACTURER='"Espressif Systems"'
	-D NEOPIXEL
	-D NEOPIXEL_NUM=1
	-D LED_PIN=48
lib_extra_dirs = custom_usb_descriptors
